name: Release
# Push a tag like v1.0.0 (git tag v1.0.0 && git push --tags), or run manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v1.0.0'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write       # keyless signing / provenance
  attestations: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go mod tidy && go vet ./... && go test ./...

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Build Linux binaries
        run: |
          go mod tidy
          mkdir -p dist
          for arch in amd64 arm64; do
            d=wg2fa-${VERSION}-linux-$arch
            mkdir -p $d
            for c in wg2fa-server wg2fa-client; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o $d/$c ./cmd/$c
            done
            cp README.md docker-compose.yml $d/
            tar czf dist/$d.tar.gz $d
          done
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  docker:
    # waits for the client builds so the image can serve them on /connect
    needs: [test, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packaging/downloads
          pattern: '[lmw]*'
          merge-multiple: true
      - run: ls -la packaging/downloads
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
      # 1) build amd64 locally and scan it BEFORE anything is published
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: VERSION=${{ env.VERSION }}
          tags: wg2fa-scan:${{ github.sha }}
          cache-from: type=gha
      - name: Vulnerability scan (fails on fixable High/Critical)
        uses: anchore/scan-action@v6
        with:
          image: wg2fa-scan:${{ github.sha }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
      # 2) multi-arch build + push with SBOM and max provenance
      - id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      # Keyless signing writes the image name to the public Rekor log, so it is
      # only used for public repositories. Private repos sign with a key pair
      # (secrets COSIGN_PRIVATE_KEY / COSIGN_PASSWORD) and skip the public log.
      - name: Sign image (keyless, public repo)
        if: ${{ !github.event.repository.private }}
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Sign image (key, private repo)
        if: ${{ github.event.repository.private && env.COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Record digest
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with: { name: image-digest, path: image-digest.txt }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go mod tidy
      - name: Import Developer ID certificate (optional)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12
      - name: Build DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/build-dmg.sh "$VERSION" dist
      - name: Notarize (optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool submit dist/*.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/*.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { goarch: amd64, arch: x64, allowed: x64compatible }
          - { goarch: arm64, arch: arm64, allowed: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Build client
        shell: bash
        run: |
          go mod tidy
          mkdir -p dist/windows-${{ matrix.goarch }}
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" -o dist/windows-${{ matrix.goarch }}/wg2fa-client.exe ./cmd/wg2fa-client
      - name: Fetch Wintun driver
        shell: pwsh
        run: |
          $zip = "wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "wintun sha256: $hash"
          if ($hash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") { throw "Wintun checksum mismatch" }
          Expand-Archive $zip -DestinationPath wintun
          Copy-Item "wintun/wintun/bin/${{ matrix.goarch }}/wintun.dll" "dist/windows-${{ matrix.goarch }}/"
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = "$env:VERSION".TrimStart('v')
          & $iscc "/DAppVersion=$v" "/DArch=${{ matrix.arch }}" "/DArchAllowed=${{ matrix.allowed }}" "/DSrcDir=..\..\dist\windows-${{ matrix.goarch }}" "/DOutDir=..\..\dist" packaging\windows\wg2fa.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "dist/windows-${{ matrix.goarch }}/*" -DestinationPath "dist/WG2FA-$env:VERSION-windows-${{ matrix.arch }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*setup.exe
            dist/*portable.zip

  release:
    needs: [linux, docker, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '[lmw]*'   # linux, macos, windows-* (skips docker build records)
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with: { name: image-digest, path: digest }
      - id: digest
        run: echo "ref=$(cat digest/image-digest.txt)" >> "$GITHUB_OUTPUT"
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build provenance attestation (public repos / GHEC)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums (key, optional)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        run: cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --output-signature dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: WG2FA ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
          body: |
            **Server (Docker):** `docker pull ghcr.io/${{ github.repository }}:${{ env.VERSION }}`
            Pin by digest in production: `${{ steps.digest.outputs.ref }}` (multi-arch, SBOM + provenance attached, vulnerability-scanned)
            **macOS:** `WG2FA-*-macos-universal.dmg` (Apple Silicon + Intel)
            **Windows:** `WG2FA-*-windows-x64-setup.exe` / `-arm64-setup.exe`
            **Linux:** server + client tarballs
