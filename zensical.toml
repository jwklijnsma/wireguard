# WG2FA documentation - built with Zensical (https://zensical.org), same design as shift-mox
#   pip install -r requirements-docs.txt
#   zensical serve            # preview on http://localhost:8000
#   zensical build --strict   # what CI runs

[project]
site_name = "WG2FA"
site_description = "Self-hosted WireGuard VPN with TOTP two-factor authentication, VPN profiles, site-to-site routers, a web GUI and macOS/Windows clients."
site_url = "https://jwklijnsma.github.io/wireguard/"
repo_url = "https://github.com/jwklijnsma/wireguard"
repo_name = "jwklijnsma/wireguard"
edit_uri = "edit/main/docs/"
copyright = "WireGuard\u00ae is a registered trademark of Jason A. Donenfeld. This project is not affiliated with the WireGuard project."
nav = [
  { "Home" = "index.md" },
  { "Screenshots" = "screenshots.md" },
  { "Install" = [
    { "Install" = "install/index.md" },
    { "Docker" = "install/docker.md" },
    { "Podman + systemd" = "install/podman.md" },
    { "Reverse proxy & TLS" = "install/reverse-proxy.md" },
    { "Configuration" = "install/configuration.md" },
  ] },
  { "Guide" = [
    { "Getting started" = "guide/getting-started.md" },
    { "Desktop clients" = "guide/clients.md" },
    { "Phones & wg-quick" = "guide/phones.md" },
    { "Routers (site-to-site)" = "guide/routers.md" },
    { "VPN profiles" = "guide/profiles.md" },
    { "Backup & restore" = "guide/backup.md" },
  ] },
  { "Security" = [
    { "Security" = "security/index.md" },
    { "Forwarding policy" = "security/forwarding-policy.md" },
    { "Hardening" = "security/hardening.md" },
    { "Supply chain" = "security/supply-chain.md" },
    { "OPSEC checklist" = "security/checklist.md" },
  ] },
  { "Development" = [
    { "Development" = "development/index.md" },
    { "Client API" = "development/client-api.md" },
    { "Releases" = "development/releases.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "material/shield-lock"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
